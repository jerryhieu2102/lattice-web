services:
  - type: web
    name: lattice-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.lock
    startCommand: python -m alembic -c alembic.ini upgrade head && python -m uvicorn main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DATE
        value: "2026-09-16"
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: lattice-db
          property: connectionString

databases:
  - name: lattice-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []
